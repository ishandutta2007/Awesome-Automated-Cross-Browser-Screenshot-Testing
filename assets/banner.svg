<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .orb1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .scan-beam { animation: scanline 5s linear infinite; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <circle class="orb1" cx="220" cy="110" r="160" fill="url(#cyanGrad)" filter="url(#glowCyan)" />
  <circle class="orb2" cx="980" cy="310" r="180" fill="url(#purpleGrad)" filter="url(#glowPurple)" />

  <!-- Subtle Animated Radar / Scanline Effect in Background -->
  <g class="scan-beam" pointer-events="none">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.4" />
    <rect x="0" y="-30" width="1200" height="30" fill="url(#cyanGrad)" opacity="0.05" />
  </g>

  <!-- Decorative Background Visual Diff Grid Nodes (Lower Right) -->
  <g class="card-float-1" opacity="0.65" transform="translate(860, 60)">
    <rect width="280" height="150" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#eab308" />
    <circle cx="52" cy="20" r="5" fill="#22c55e" />
    <text x="75" y="24" fill="#64748b" font-size="11" class="mono">baseline-spec.png</text>
    <rect x="20" y="42" width="240" height="18" rx="4" fill="#1e293b" />
    <rect x="20" y="68" width="180" height="12" rx="3" fill="#1e293b" />
    <rect x="20" y="88" width="210" height="12" rx="3" fill="#1e293b" />
    <!-- Visual Diff Highlight -->
    <rect x="180" y="66" width="60" height="28" rx="4" fill="#ec4899" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 3">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="210" y="84" fill="#fb7185" font-size="9" text-anchor="middle" font-weight="bold" class="mono">DIFF</text>
  </g>

  <g class="card-float-2" opacity="0.55" transform="translate(890, 230)">
    <rect width="250" height="130" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="28" fill="#38bdf8" font-size="11" font-weight="bold" class="mono">✓ Visual Regression CI</text>
    <path d="M 20 60 Q 60 40 100 65 T 180 55 T 230 45" fill="none" stroke="#22c55e" stroke-width="2" />
    <circle cx="100" cy="65" r="4" fill="#22c55e" />
    <circle cx="180" cy="55" r="4" fill="#22c55e" />
    <circle cx="230" cy="45" r="4" fill="#22c55e" />
    <text x="20" y="105" fill="#64748b" font-size="10" class="mono">99.98% Pixel Accuracy</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always 100% sharp and readable) -->
  <g transform="translate(90, 110)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="15" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" fill="#93c5fd" font-size="12" font-weight="640" class="sans" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#titleGrad)" font-size="44" font-weight="800" class="sans" letter-spacing="-0.5">
      Automated Cross-Browser
    </text>
    <text x="0" y="132" fill="#f8fafc" font-size="40" font-weight="800" class="sans" letter-spacing="-0.5">
      Screenshot Testing
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="174" fill="#94a3b8" font-size="17" font-weight="400" class="sans">
      Visual Regression Testing • Pixel Diffing • Storybook &amp; CI/CD Validation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="mono">SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72.5" y="18" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle" class="mono">Open Source Repos</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle" class="mono">Automated CI/CD</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(435, 0)">
        <rect x="0" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="18" fill="#fb923c" font-size="11" font-weight="600" text-anchor="middle" class="mono">Pixelmatch &amp; AI</text>
      </g>
    </g>
  </g>

  <!-- Clean Border Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
